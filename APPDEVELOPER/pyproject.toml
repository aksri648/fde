[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appdeveloper"
version = "0.1.0"
description = "APPDEVELOPER — Python microservice for AI-powered app generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.9.0,<2.10.0",
    "pydantic-settings>=2.5.0,<2.6.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "claude-agent-sdk>=0.1.0",
    "daytona>=0.198.0",
    "httpx>=0.27.0,<0.28.0",
    "python-dotenv>=1.0.0,<1.1.0",
    "structlog>=24.1.0,<24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "ruff>=0.7.0,<0.8.0",
    "mypy>=1.11.0,<1.12.0",
    "bandit>=1.7.0,<1.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "A", "C4", "SIM", "TCH"]
ignore = ["B008", "B904"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 60
