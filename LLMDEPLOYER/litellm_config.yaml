model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # Template for dynamically deployed vLLM/NIM endpoints
  # Uncomment and customize as needed:
