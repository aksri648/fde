[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "fde-backend"
version = "0.1.0"
description = "Forward Deployed Engineer planning and routing backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "redis>=5.2.0,<6.0",
    "pyjwt>=2.9.0,<3.0",
    "cryptography>=43.0.0,<44.0",
    "structlog>=24.4.0,<25.0",
    "prometheus-client>=0.21.0,<1.0",
    "respx>=0.21.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0",
    "mypy>=1.12.0,<2.0",
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "bandit>=1.8.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "app/workers/*",
    "app/services/claude_planner_real.py",
    "app/services/outbox_worker.py",
    "app/services/proposal_service.py",
    "app/services/planning_service.py",
    "app/clients/appdeveloper_client.py",
    "app/clients/llmdeployer_client.py",
    "app/security/rate_limit.py",
    "app/security/request_limits.py",
    "app/repositories/*",
    "app/db/session.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
