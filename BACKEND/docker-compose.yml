services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fde_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: fde_backend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde_user -d fde_backend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-fde-litellm-master}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fde_user:change_me@postgres:5432/fde_backend
      REDIS_URL: redis://redis:6379/0
      LITELLM_PROXY_URL: http://litellm:4000
      APPDEVELOPER_BASE_URL: http://appdeveloper:8001
      LLMDEPLOYER_BASE_URL: http://llmdeployer:8002
      PLANNER_MODE: ${PLANNER_MODE:-fake}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fde_user:change_me@postgres:5432/fde_backend
      REDIS_URL: redis://redis:6379/0
      APPDEVELOPER_BASE_URL: http://appdeveloper:8001
      LLMDEPLOYER_BASE_URL: http://llmdeployer:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
